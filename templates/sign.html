{% extends "base.html" %}
{% block title %}Create Account - StudentTrack{% endblock %}

{% block content %}
<main class="auth">

    <section class="auth-about">
        {% include "about.html" %}
    </section>

    <section class="auth-form">
        <div class="card auth-card">
            <h2>Create your account ✨</h2>
            <p class="hint">It takes less than a minute.</p>

            <form action="/signup" method="post">
                <div class="field">
                    <label for="username">Student Name</label>
                    <input class="input" type="text" id="username" name="username" placeholder="Enter your name" required>
                </div>

                <div class="field">
                    <label for="father">Father's Name</label>
                    <input class="input" type="text" id="father" name="Father_name" placeholder="Father's name" required>
                </div>

                <div class="field">
                    <label for="enroll">Enrollment No</label>
                    <input class="input" type="text" id="enroll" name="Enrollment" placeholder="Enrollment no" required>
                </div>

                <div class="field">
                    <label for="mobile">Mobile No (10 digits)</label>
                    <input class="input" type="text" id="mobile" name="Mobile" placeholder="Mobile no" pattern="[0-9]{10}" title="Write 10 digits" required>
                </div>

                <div class="field">
                    <label for="email">Email Id</label>
                    <input class="input" type="email" id="email" name="Gmail" placeholder="Email" required>
                </div>

                <div class="field">
                    <label for="pass">Password (at least 6 characters)</label>
                    <div class="password-wrap">
                        <input class="input" type="password" id="pass" name="password" placeholder="Create a password" minlength="6" required>
                        <button type="button" data-toggle-password="pass">Show</button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Create Account</button>
            </form>

            <div class="link-row">
                <span>Already have an account?</span>
                <a href="/"><b>Login →</b></a>
            </div>
        </div>
    </section>

</main>
{% endblock %}
