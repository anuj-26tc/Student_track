<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User detials</title>
    <style>
        body {
            text-align: center;
            background-color: #f3f4f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .signup-container {
            text-align: center;
            width: 350px;
            height: auto;
            padding: 30px;
            /* background-color: #ffffff; */
            background: linear-gradient(135deg, #dae0ed, #60a5fa);
            color: #222222;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);

        }

        .signup-container h2 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 25px;
            color: #1f2937;

        }

        .form-group {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #4b5563;
        }

        .form-group input,
        .form-group select {
            padding: 10px 12px;
            font-size: 15px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            outline: none;
           
        }

        .form-group input :focus,
        .form-group select :focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);

        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .button-group button {
            flex: 1;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            border: none;
            transition: background-color 0.2s;

        }

        .btn-submit {
            background-color: #4f46e5;
            color: white;

        }

        .btn-submit:hover {
            background-color: #4338ca;
        }

        .btn-cancel {
            background-color: #f3f4f6;
            color: white;

        }

        .btn-cancel:hover {
            background-color: #b5b7ba;
        }
    </style>
</head>

<body>
    <div class="signup-container">
        <h2>Sign Up</h2>
        <form action="/signup" method="post">

            <div class="form-group"><label>Student Name</label>
                <input type="text" name="username" placeholder="Enter Name" required>
            </div>
            <div class="form-group"><label>Father's Name</label>
                <input type="text" name="Father_name" placeholder="Father's name" required>
            </div>

            <div class="form-group"><label>Enrollment No</label>
                <input type="text" name="Enrollment" placeholder="Enrollment no" required>
            </div>
            <div class="form-group"><label>Mobile no</label>
                <input type="text" name="Mobile" placeholder="Mobile" required>
            </div>
            <div class="form-group"> <label>Email Id</label>
                <input type="email" name="Gmail" placeholder="Email" required>
            </div>
            <div class="form-group"><label>Password</label>
            <input type="password" name="password" placeholder="Password" required></div>

            <div class="button-group"> <button type="button" class="btn-cancel">Cancel</button>
                <button type="submit" class="btn-submit">Submit</button>

            </div>
            <div class="form-group">
                <p>Already have an account?
                    <a href="/login" style="text-decoration: none;">Login</a>
                </p>
            </div>
        </form>


    </div>
</body>

</html>
