{% extends "base.html" %}
{% block title %}Login - StudentTrack{% endblock %}

{% block content %}
<main class="auth">

    <section class="auth-about">
        {% include "about.html" %}
    </section>

    <section class="auth-form">
        <div class="card auth-card">
            <h2>Welcome back 👋</h2>
            <p class="hint">Login to see your dashboard.</p>

            <form action="/login" method="post">
                <div class="field">
                    <label for="enrollment">Enrollment No</label>
                    <input class="input" type="text" id="enrollment" name="enrollment" placeholder="Enter your enrollment no" required autofocus>
                </div>

                <div class="field">
                    <label for="pass">Password</label>
                    <div class="password-wrap">
                        <input class="input" type="password" id="pass" name="password" placeholder="Enter your password" required>
                        <button type="button" data-toggle-password="pass">Show</button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Login</button>
            </form>

            <div class="divider">New here?</div>
            <a href="/sign" class="btn btn-ghost btn-block">Create Account</a>

            <div class="link-row">
                <span>Are you a teacher?</span>
                <a href="/teacher"><b>Teacher Login →</b></a>
            </div>
        </div>
    </section>

</main>
{% endblock %}
